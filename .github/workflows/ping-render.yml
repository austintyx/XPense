name: Ping Render backend

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 \
            "${{ vars.RENDER_HEALTH_URL || 'https://xpense-kkya.onrender.com/health' }}"
