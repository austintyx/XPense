name: Keep Supabase database awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client
      - name: Lightweight query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -c "SELECT 1;"
