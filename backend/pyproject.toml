[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xpense-backend"
version = "0.1.0"
description = "Auto expense tracker backend (email-parsing)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "httpx",
    "cryptography",
    "apscheduler",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
