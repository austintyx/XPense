[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xpense-backend"
version = "0.1.0"
description = "Auto expense tracker backend (email-parsing)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
